<footer>

  <div>

    <p class="logo">

      <a href="https://uranium.io/" title="return to the Uranium.io home page">
        <svg class="uranium" width="160"><use xlink:href="#uraniumlogo"></use></svg>
      </a><a href="${ tacs.root }" title="${ tacs.config.title }">
        ${ tacs.config.footerTitle ? `<span><strong>${ tacs.config.footerTitle }</strong>${ tacs.config.footerContent }</span>` : '' }
      </a>

    </p>

    <p class="home">
      <a href="https://uranium.io/" title="return to the Uranium.io home page" class="button">Uranium.io<svg width="20"><use xlink:href="#arr-ur"></use></svg></a>
    </p>

  </div>

  <hr>

  <div>

    <div>

      <ul class="share linklist">
        ${ tacs.config.socialLinks.map(s => `<li><a href="${ s.url }" title="${ s.link }"><svg><use xlink:href="#icon-${ s.link.replace(/\W/g,'').toLowerCase() }"></use></svg> <span>${ s.link }</span></a></li>`) }
      </ul>

      <ul class="terms linklist">
        ${ tacs.config.footerLinks.map(f => `<li><a href="${ f.url }">${ f.link }</a></li>`) }
      </ul>

    </div>

    <div class="powered">
      <p>Powered by</p>

      <ul>
        <li><img src="${ tacs.root }media/static/curzon.svg" width="75" height="25" alt="Curzon Uranium" loading="lazy"></li>
        <li><img src="${ tacs.root }media/static/tezos.svg" width="75" height="25" alt="Tezos" loading="lazy"></li>
        <li><img src="${ tacs.root }media/static/archax.svg" width="75" height="25" alt="Archax" loading="lazy"></li>
      </ul>

    </div>

  </div>

</footer>
